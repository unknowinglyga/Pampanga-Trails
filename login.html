<!DOCTYPE html>
<html class="main" lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pampanga Trails</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300&display=swap" rel="stylesheet">
        <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
        <style>
      
            .auth-wrap { 
                display: flex; 
                justify-content: 
                center; padding: 20px 20px 80px; 
            }

            .menu-box {
                background: #fff; 
                color: #222; 
                width: 100%; 
                max-width: 420px;
                padding: 40px 35px; 
                border-radius: 10px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            }

            .menu-box h1 { 
                font-size: 28px; 
                font-weight: 500; 
                text-align: center; 
                margin-bottom: 6px; 
                color: #222; 
            }
            .menu-box .sub { 
                text-align: center; 
                color: #777; 
                font-size: 14px; 
                margin-bottom: 20px;
            }
            .menu-box label { 
                display: block; 
                font-size: 13px; 
                color: #444; 
                margin: 14px 0 6px; 
            }

            .menu-box input[type="text"],
            
            .menu-box input[type="email"],
            
            .menu-box input[type="password"] {
          
                width: 100%; 
                padding: 12px 14px; 
                border: 1px solid #ccc; 
                border-radius: 5px;
                font-family: 'Poppins', sans-serif; 
                font-size: 14px; 
                color: #222;
            }

            .auth-row { 
                display: flex; 
                justify-content: space-between; 
                align-items: center; 
                font-size: 13px; 
                margin-top: 14px; 
                color: #555; 
            }

            .auth-row label { 
                display: flex; 
                align-items: center; 
                gap: 6px; 
                margin: 0; 
            }

            .menu-box a { 
                color: var(--butthover); 
                text-decoration: none; 
            }

         
            .menu-box a.buttoni {
                display: block; 
                box-sizing: border-box; 
                width: 100%; 
                margin-top: 22px; 
                padding: 12px;
                border-radius: 5px; 
                background: var(--butthover); 
                color: #fff; 
                text-align: center;
                font-family: 'Poppins', sans-serif; 
                font-size: 15px;
            }

            .switch { 
                text-align: center; 
                font-size: 13px; 
                color: #555; 
                margin-top: 20px; 
            }
        </style>
    </head>
    <body>
        <section class="header">
            <nav>
                <a href="rise.html" class="logo">Pampanga Trails</a>
                <div class="nav-links">
                    <i class='bx bx-x'></i>
                    <ul>
                        <li><a href="rise.html">Home</a></li>
                        <li><a href="aboutus.html">About</a></li>
                        <li><a href="rise.html#section2">Travel Basics</a></li>
                        <li><a href="rise.html#section3">Destinations</a></li>
                        <li><a href="rise.html#contact">Contact</a></li>
                        <li><a href="login.html" class="nav-btn">Login / Register</a></li>
                    </ul>
                </div>
                <i class='bx bx-menu-alt-right'></i>
            </nav>

            <div class="auth-wrap">
                <div class="menu-box">
                    <h1>Welcome back</h1>
                    <p class="sub">Log in to save your favorite places.</p>

                    <div>
                        <label>Email</label>
                        <input type="email" placeholder="you@example.com">

                        <label>Password</label>
                        <input type="password" placeholder="Enter your password">

                        <div class="auth-row">
                            <label><input type="checkbox"> Remember me</label>
                            <a href="#">Forgot password?</a>
                        </div>

                        <a href="rise.html" class="buttoni">Log In</a>
                    </div>

                    <p class="switch">Don't have an account? <a href="register.html">Register</a></p>
                </div>
            </div>
        </section>

<!------Footer------>
<section class="footer">
    <h4>Follow Us</h4>
        <div class="icons">
           <a href="#"><i class='bx bxl-facebook-circle'></i></a>
            <a href="#"><i class='bx bxl-instagram-alt'></i></a>
        </div>
    <p>&copy; 2023 Pampanga Trails. All rights reserved.</p>
</section>

    </body>
</html>
