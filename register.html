<!DOCTYPE html>
<html class="main" lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pampanga Trails</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300&display=swap" rel="stylesheet">
        <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
        <style>

           
            .thingy { 
                display: flex; 
                justify-content: center; 
                padding: 20px 20px 80px; }

            .card {
                background: #fff; 
                color: #222; 
                width: 100%; 
                max-width: 420px;
                padding: 40px 35px; 
                border-radius: 10px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            }

            .card h1 { 
                font-size: 28px; 
                font-weight: 500; 
                text-align: center; 
                margin-bottom: 6px; 
                color: #222; 
            }

            .card .sub { 
                text-align: center; 
                color: #777; 
                font-size: 14px; 
                margin-bottom: 20px; 
            }
            .card label { 
                display: block; 
                font-size: 13px; 
                color: #444; 
                margin: 14px 0 6px; 
            }

            .card input[type="text"],
           
            .card input[type="email"],
          
            .card input[type="password"] {
                width: 100%; 
                padding: 12px 14px; 
                border: 1px solid #ccc; 
                border-radius: 5px;
                font-family: 'Poppins', sans-serif; 
                font-size: 14px; 
                color: #222;
            }

            .agreement { 
                display: flex; 
                justify-content: space-between; 
                align-items: center; 
                font-size: 13px; 
                margin-top: 14px; 
                color: #555; 
            }
            .agreement label { 
                display: flex; 
                align-items: center; 
                gap: 6px; 
                margin: 0; 
            }

            .card a { 
                color: var(--accent, #f44336); 
                text-decoration: none; 
            }

            .buttony {
                width: 100%; 
                margin-top: 22px; 
                padding: 12px; 
                border: none; 
                border-radius: 5px;
                background: var(--accent, #f44336); 
                color: #fff; 
                font-family: 'Poppins', sans-serif;
                font-size: 15px;
            }

            .switch {
                text-align: center; 
                font-size: 13px; 
                color: #555; 
                margin-top: 20px; 
            }
            
        </style>
    </head>
    <body>
        <section class="header">
            <nav>
                <a href="rise.html" class="logo">Pampanga Trails</a>
                <div class="nav-links">
               
                    <ul>
                        <li><a href="rise.html">Home</a></li>
                        <li><a href="aboutus.html">About</a></li>
                        <li><a href="rise.html#section2">Travel Basics</a></li>
                        <li><a href="rise.html#section3">Destinations</a></li>
                        <li><a href="rise.html#contact">Contact</a></li>
                        <li><a href="login.html" class="nav-btn">Login / Register</a></li>
                    </ul>
                </div>
      
            </nav>

            <div class="thingy">
                <div class="card">
                    <h1>Create an account</h1>
                    <p class="sub">Join Pampanga Trails to save places and share tips.</p>

                    <div>
                        <label>Full name</label>
                        <input type="text" placeholder="Juan Dela Cruz">

                        <label>Email</label>
                        <input type="email" placeholder="you@example.com">

                        <label>Password</label>
                        <input type="password" placeholder="At least 8 characters">

                        <label>Confirm password</label>
                        <input type="password" placeholder="Re-enter your password">

                        <div class="agreement">
                            <label><input type="checkbox"> I agree to the <a href="#">Terms</a></label>
                        </div>

                        <button type="button" class="buttony">Create Account</button>
                    </div>

                    <p class="switch">Already have an account? <a href="login.html">Log in</a></p>
                </div>
            </div>
        </section>

<!------Footer------>
<section class="footer">
    <h4>Follow Us</h4>
        <div class="icons">
           <a href="#"><i class='bx bxl-facebook-circle'></i></a>
            <a href="#"><i class='bx bxl-instagram-alt'></i></a>
        </div>
    <p>&copy; 2023 Pampanga Trails. All rights reserved.</p>
</section>

    </body>
</html>
